<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Paramètres - EducInspect</title>
    <link rel="icon" type="image/x-icon" href="../assets/img/favicon.png">
    <link href="../assets/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="../assets/fonts/themify-icons.css" rel="stylesheet">
    <link href="../assets/css/dashboard-einspect.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        .form-container {
            max-width: 720px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #eef2f7;
            box-shadow: 0 2px 8px rgba(10, 30, 60, 0.04);
            padding: 32px 40px;
        }
        .form-title {
            font-size: 24px;
            font-weight: 800;
            color: #0a1e3c;
            margin-bottom: 8px;
        }
        .form-subtitle {
            font-size: 14px;
            color: #6b7a93;
            margin-bottom: 28px;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label { display:block; font-weight:700; font-size:14px; color:#1a2a4a; margin-bottom:6px; }
        .form-control { width:100%; padding:10px 16px; border:1px solid #e4e9f0; border-radius:12px; font-size:14px; background:#f8fafc; color:#1a2a4a; }
        .form-control:focus { outline:none; border-color:#2a6df4; box-shadow:0 0 0 4px rgba(42,109,244,0.10); background:#fff; }
        .form-actions { display:flex; gap:12px; margin-top:28px; flex-wrap:wrap; }
        .btn-primary { display:inline-flex; align-items:center; gap:8px; padding:10px 28px; background:#2a6df4; color:#fff; font-weight:700; border-radius:12px; border:none; text-decoration:none; cursor:pointer; }
        .btn-secondary { display:inline-flex; align-items:center; gap:8px; padding:10px 28px; background:#f0f3f8; color:#1a2a4a; font-weight:700; border-radius:12px; border:1px solid #e4e9f0; text-decoration:none; cursor:pointer; }
        .form-message { margin-top: 18px; font-weight: 700; }
        @media (max-width:768px) { .form-container{padding:24px 18px;} .form-actions{flex-direction:column;} .btn-primary,.btn-secondary{width:100%;justify-content:center;} }
    </style>
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <a class="brand" href="../index.html"><img src="../assets/img/logo1.png" alt="EducInspect"><span>EducInspect</span></a>
            <div class="profile"><div class="avatar">PR</div><div><strong data-user-name>Utilisateur</strong><p data-user-role>Profil</p></div></div>
            <nav class="side-nav" data-role-sidebar></nav>
            <p class="copyright">© 2026 EducInspect</p>
        </aside>
        <main class="main">
            <header class="topbar">
                <button class="menu-btn" type="button"><span class="ti-menu"></span></button>
                <div class="search"><span class="ti-search"></span><input type="search" placeholder="Rechercher dans votre profil..."></div>
                <div class="top-actions"><button class="icon-btn" type="button"><span class="ti-arrow-left"></span></button><div class="user-menu"><span class="ti-user"></span> <span data-user-role>Profil</span></div></div>
            </header>
            <section class="dashboard-head">
                <div><p class="eyebrow">Paramètres du compte</p><h1>Modifier mon profil</h1><p>Mettre à jour votre nom, email et mot de passe personnel.</p></div>
                <div class="period"><span class="ti-user"></span> Mon compte</div>
            </section>
            <section class="workspace-grid">
                <div class="panel form-panel">
                    <div class="panel-head"><h2>Informations du compte</h2><span class="legend">Sécurisé</span></div>
                    <section class="form-container">
                        <h2 class="form-title">Mon profil</h2>
                        <p class="form-subtitle">Mettez à jour vos informations personnelles.</p>
                        <form id="profileForm" data-profile-form>
                            <div class="form-group">
                                <label for="name">Nom complet <span class="required">*</span></label>
                                <input id="name" name="name" type="text" class="form-control" placeholder="Nom complet" required>
                            </div>
                            <div class="form-group">
                                <label for="email">Email <span class="required">*</span></label>
                                <input id="email" name="email" type="email" class="form-control" placeholder="Email" required>
                            </div>
                            <div class="form-group">
                                <label for="password">Nouveau mot de passe</label>
                                <input id="password" name="password" type="password" class="form-control" placeholder="Laisser vide pour conserver l'actuel">
                            </div>
                            <div class="form-group">
                                <label for="signature">Signature (image)</label>
                                <input id="signature" name="signature" type="file" accept="image/*" class="form-control">
                                <div class="signature-preview" style="margin-top:12px;">
                                    <img id="signaturePreview" alt="Aperçu de la signature" style="display:none;max-width:240px;border:1px solid #e4e9f0;border-radius:12px;padding:8px;" />
                                </div>
                            </div>
                            <div class="form-actions">
                                <button class="btn-primary" type="submit"><span class="ti-save"></span> Enregistrer</button>
                                <a class="btn-secondary" id="backToDashboard" href="../index.html"><span class="ti-arrow-left"></span> Retour</a>
                            </div>
                            <p class="form-message" data-profile-message></p>
                        </form>
                    </section>
                </div>
            </section>
        </main>
    </div>
    <script src="../assets/js/api-einspect.js"></script>
    <script src="../assets/js/role-guard-einspect.js"></script>
    <script>
        const user = JSON.parse(localStorage.getItem('educinspect_user') || '{}');
        const profileRole = Array.isArray(user.roles)
            ? (user.roles[0]?.name || user.roles[0] || user.role)
            : user.role || '';
        const roleNames = {
            admin: 'Administrateur',
            directeur_departemental: 'Direction departementale',
            inspecteur: 'Inspecteur pedagogique',
            directeur_ecole: 'Direction d\'ecole',
            enseignant: 'Enseignant'
        };
        document.querySelectorAll('[data-user-name]').forEach((el) => el.textContent = user.name || 'Utilisateur');
        document.querySelectorAll('[data-user-role]').forEach((el) => el.textContent = roleNames[profileRole] || 'Utilisateur');

        const backLinks = {
            admin: 'admin.html',
            directeur_departemental: 'direction.html',
            inspecteur: 'inspecteur.html',
            directeur_ecole: 'ecole.html',
            enseignant: 'enseignant.html'
        };
        const backToDashboard = document.getElementById('backToDashboard');
        if (backToDashboard) {
            backToDashboard.href = backLinks[profileRole] || '../index.html';
        }

        const sidebar = document.querySelector('[data-role-sidebar]');
        if (sidebar) {
            const menuItems = {
                admin: [
                    { label: 'Dashboard admin', icon: 'ti-dashboard', href: 'admin.html' },
                    { label: 'Utilisateurs', icon: 'ti-user', href: 'admin-utilisateurs.html' },
                    { label: 'Roles et permissions', icon: 'ti-lock', href: 'admin-roles.html' },
                    { label: 'Departements', icon: 'ti-map', href: 'admin-departements.html' },
                    { label: 'Communes', icon: 'ti-location-pin', href: 'admin-communes.html' },
                    { label: 'Ecoles', icon: 'ti-home', href: 'admin-ecoles.html' },
                    { label: 'Inspecteurs', icon: 'ti-user', href: 'admin-inspecteurs.html' },
                    { label: 'Paramètres', icon: 'ti-settings', href: 'profile.html' },
                    { label: 'Deconnexion', icon: 'ti-power-off', href: 'deconnexion.html' }
                ],
                directeur_departemental: [
                    { label: 'Calendrier', icon: 'ti-calendar', href: 'calendrier-direction.html' },
                    { label: 'Rapports', icon: 'ti-files', href: 'consultation-rapports.html' },
                    { label: 'Statistiques', icon: 'ti-bar-chart', href: 'statistiques-direction.html' },
                    { label: 'Recommandations', icon: 'ti-star', href: 'recommandations-direction.html' },
                    { label: 'Paramètres', icon: 'ti-settings', href: 'profile.html' },
                    { label: 'Deconnexion', icon: 'ti-power-off', href: 'deconnexion.html' }
                ],
                inspecteur: [
                    { label: 'Missions', icon: 'ti-briefcase', href: 'missions-inspecteur.html' },
                    { label: 'Calendrier', icon: 'ti-calendar', href: 'calendrier-inspecteur.html' },
                    { label: 'Fiches', icon: 'ti-file', href: 'fiches-inspecteur.html' },
                    { label: 'Rapports', icon: 'ti-files', href: 'rapports-inspecteur.html' },
                    { label: 'Paramètres', icon: 'ti-settings', href: 'profile.html' },
                    { label: 'Deconnexion', icon: 'ti-power-off', href: 'deconnexion.html' }
                ],
                directeur_ecole: [
                    { label: 'École', icon: 'ti-home', href: 'ecole.html' },
                    { label: 'Rapports', icon: 'ti-files', href: 'ecole-rapports.html' },
                    { label: 'Plan d\'action', icon: 'ti-check-box', href: 'ecole-plan-daction.html' },
                    { label: 'Observations', icon: 'ti-comments', href: 'ecole-observations.html' },
                    { label: 'Créer un enseignant', icon: 'ti-user', href: 'ajouter-enseignant.html' },
                    { label: 'Recommandations', icon: 'ti-star', href: 'ecole-recommandations.html' },
                    { label: 'Calendrier', icon: 'ti-calendar', href: 'ecole-calendrier.html' },
                    { label: 'Équipe', icon: 'ti-user', href: 'ecole-enseignants.html' },
                    { label: 'Paramètres', icon: 'ti-settings', href: 'profile.html' },
                    { label: 'Deconnexion', icon: 'ti-power-off', href: 'deconnexion.html' }
                ],
                enseignant: [
                    { label: 'Enseignant', icon: 'ti-blackboard', href: 'enseignant.html' },
                    { label: 'Rapports', icon: 'ti-files', href: 'enseignant-rapport.html' },
                    { label: 'Observations', icon: 'ti-comments', href: 'enseignant-observation.html' },
                    { label: 'Actions pedagogiques', icon: 'ti-check-box', href: 'enseignant-Actions-pedagogiques.html' },
                    { label: 'Paramètres', icon: 'ti-settings', href: 'profile.html' },
                    { label: 'Deconnexion', icon: 'ti-power-off', href: 'deconnexion.html' }
                ]
            };
            const items = menuItems[profileRole] || [{ label: 'Paramètres', icon: 'ti-settings', href: 'profile.html' }, { label: 'Deconnexion', icon: 'ti-power-off', href: 'deconnexion.html' }];
            const currentPage = window.location.pathname.split('/').pop();
            sidebar.innerHTML = items.map((item) => `
                <a class="${item.href === currentPage ? 'active' : ''}" href="${item.href}"><span class="${item.icon}"></span>${item.label}</a>
            `).join('');
        }

        const form = document.querySelector('[data-profile-form]');
        const message = document.querySelector('[data-profile-message]');
        const signatureInput = document.getElementById('signature');
        const signaturePreview = document.getElementById('signaturePreview');

        const storedSignature = user.signature_path || localStorage.getItem('educinspect_signature');
        if (storedSignature && signaturePreview) {
            signaturePreview.src = storedSignature;
            signaturePreview.style.display = 'block';
        }

        if (form) {
            if (user.name) form.elements.name.value = user.name;
            if (user.email) form.elements.email.value = user.email;

            signatureInput?.addEventListener('change', (event) => {
                const file = event.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    if (signaturePreview) {
                        signaturePreview.src = reader.result;
                        signaturePreview.style.display = 'block';
                    }
                };
                reader.readAsDataURL(file);
            });

            form.addEventListener('submit', async (event) => {
                event.preventDefault();
                if (!user.id) {
                    if (message) message.textContent = 'Aucun utilisateur connecté.';
                    return;
                }
                const payload = {
                    name: form.elements.name.value,
                    email: form.elements.email.value
                };
                if (form.elements.password.value) payload.password = form.elements.password.value;
                if (signaturePreview?.src) {
                    payload.signature_path = signaturePreview.src;
                }
                try {
                    if (message) {
                        message.textContent = 'Enregistrement en cours...';
                        message.dataset.type = 'info';
                    }
                    await window.EducInspectApi.updateAdminUser(user.id, payload);
                    const updated = { ...user, ...payload };
                    localStorage.setItem('educinspect_user', JSON.stringify(updated));
                    if (payload.signature_path) {
                        localStorage.setItem('educinspect_signature', payload.signature_path);
                    }
                    document.querySelectorAll('[data-user-name]').forEach((el) => el.textContent = updated.name || el.textContent);
                    if (message) {
                        message.textContent = 'Profil mis a jour avec succes.';
                        message.dataset.type = 'success';
                    }
                    form.elements.password.value = '';
                } catch (error) {
                    if (message) {
                        message.textContent = error.message || 'Erreur pendant la mise a jour du profil.';
                        message.dataset.type = 'error';
                    }
                }
            });
        }
    </script>
</body>
</html>
