<!DOCTYPE html>
<html lang="fr">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Déconnexion - EducInspect</title>
		<link rel="icon" type="image/x-icon" href="../assets/img/favicon.png">
		<link href="../assets/bootstrap/css/bootstrap.min.css" rel="stylesheet">
		<link href="../assets/fonts/themify-icons.css" rel="stylesheet">
		<link href="../assets/css/dashboard-einspect.css" rel="stylesheet">
		<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800;900&display=swap" rel="stylesheet">
		<style>
			body {
				margin: 0;
				min-height: 100vh;
				font-family: 'Mulish', sans-serif;
				background:
					radial-gradient(circle at top left, rgba(42,109,244,.18), transparent 32%),
					radial-gradient(circle at bottom right, rgba(13,61,140,.18), transparent 28%),
					#f3f7fb;
			}
			.logout-shell {
				display: grid;
				place-items: center;
				min-height: 100vh;
				padding: 24px;
			}
			.logout-card {
				display: grid;
				grid-template-columns: 1fr 1fr;
				max-width: 980px;
				width: 100%;
				background: #fff;
				border: 1px solid #e6edf5;
				border-radius: 24px;
				box-shadow: 0 18px 48px rgba(10, 30, 60, 0.10);
				overflow: hidden;
			}
			.logout-visual {
				padding: 42px;
				background: linear-gradient(135deg, #0b2f6d, #1f5fd9);
				color: #fff;
				position: relative;
			}
			.logout-visual::after {
				content: '';
				position: absolute;
				inset: auto -40px -40px auto;
				width: 180px;
				height: 180px;
				background: rgba(255,255,255,.08);
				border-radius: 50%;
			}
			.brand-chip {
				display: inline-flex;
				align-items: center;
				gap: 10px;
				padding: 10px 14px;
				border-radius: 999px;
				background: rgba(255,255,255,.12);
				font-size: 13px;
				font-weight: 800;
				letter-spacing: .04em;
				text-transform: uppercase;
			}
			.logout-visual h1 {
				margin: 26px 0 10px;
				font-size: 34px;
				font-weight: 900;
			}
			.logout-visual p {
				margin: 0;
				font-size: 15px;
				line-height: 1.7;
				color: rgba(255,255,255,.88);
			}
			.logout-content {
				padding: 42px;
				display: flex;
				flex-direction: column;
				justify-content: center;
			}
			.logout-icon {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				width: 84px;
				height: 84px;
				margin-bottom: 18px;
				border-radius: 22px;
				background: #eef4ff;
				color: #2563eb;
				font-size: 34px;
				box-shadow: 0 12px 30px rgba(37,99,235,.18);
			}
			.logout-content h2 {
				margin: 0 0 10px;
				font-size: 28px;
				font-weight: 900;
				color: #0a1e3c;
			}
			.logout-content p {
				margin: 0 0 22px;
				font-size: 15px;
				color: #5f6f89;
				line-height: 1.7;
			}
			.logout-message {
				padding: 14px 16px;
				border-radius: 14px;
				background: #eff6ff;
				color: #1d4ed8;
				font-weight: 700;
				border: 1px solid #bfdbfe;
			}
			.logout-actions {
				display: flex;
				gap: 12px;
				flex-wrap: wrap;
			}
			.logout-actions .primary-action,
			.logout-actions .secondary-action {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				min-width: 170px;
				padding: 12px 18px;
				border-radius: 14px;
				font-weight: 900;
				font-size: 14px;
				text-decoration: none;
				letter-spacing: .01em;
				transition: all .25s ease;
			}
			.logout-actions .primary-action {
				background: linear-gradient(135deg, #2563eb, #1d4ed8);
				color: #fff;
				box-shadow: 0 12px 28px rgba(37,99,235,.28);
			}
			.logout-actions .secondary-action {
				background: #edf4ff;
				color: #1d4ed8;
				border: 1px solid #c9d8fb;
			}
			.logout-actions .primary-action:hover,
			.logout-actions .secondary-action:hover {
				transform: translateY(-2px);
				box-shadow: 0 16px 34px rgba(31, 64, 153, .18);
				text-decoration: none;
			}
			@media (max-width: 768px) {
				.logout-card { grid-template-columns: 1fr; }
				.logout-visual, .logout-content { padding: 28px; }
				.logout-actions { flex-direction: column; }
			}
		</style>
	</head>
	<body class="logout-page">
		<div class="logout-shell">
			<div class="logout-card">
				<div class="logout-visual">
					<div class="brand-chip"><span class="ti-shield"></span> EducInspect</div>
					<h1>Merci pour votre visite.</h1>
					<p>La session a été fermée proprement. Vous pouvez revenir sur la plateforme dès que vous êtes prêt.</p>
				</div>
				<div class="logout-content">
					<div class="logout-icon"><span class="ti-power-off"></span></div>
					<h2>Déconnexion</h2>
					<p class="logout-message" data-logout>Fermeture de votre session EducInspect...</p>
					<div class="logout-actions">
						<a href="../login.html" class="primary-action">Se reconnecter</a>
						<a href="../index.html" class="secondary-action">Retour au site</a>
					</div>
				</div>
			</div>
		</div>
		<script src="../assets/js/api-einspect.js"></script>
		<script src="../assets/js/auth-einspect.js"></script>
	</body>
</html>
